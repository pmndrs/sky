name: docs

# Single owner of this repo's GitHub Pages site. Builds the pmndrs/docs MDX
# site (docs/) AND the examples/vanilla gallery, merges the examples build
# into the docs output under /examples/, and deploys ONE Pages artifact.
#
# Why not `uses: pmndrs/docs/.github/workflows/build.yml@v4`: that reusable
# workflow ends with its own `upload-pages-artifact` (path `out`), and a
# reusable-workflow job can't have steps appended, so there'd be no way to add
# the examples gallery to the same Pages site. Instead we run the same build
# command it runs, `npx @pmndrs/docs@4 build <mdx> out --format website`, with
# the same environment, as a step of our own job. pmndrs/docs v4 replaced the
# ghcr.io/pmndrs/docs Docker image (no longer published, issue #7) with this
# CLI. If pmndrs/docs changes its env contract, re-sync the "Build docs site"
# step below against that workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # @pmndrs/docs v4 needs Node >= 20.9; its own workflow uses 24.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: configurepages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - id: set-base-path
        run: echo "BASE_PATH=${{ steps.configurepages.outputs.base_path }}" >> "$GITHUB_OUTPUT"

      # --- 1. Docs site: the pmndrs/docs CLI, as in its reusable workflow
      # (see the header for why it isn't called directly). Output: ./out
      - name: Build docs site
        run: npx -y @pmndrs/docs@4 build docs out --format website
        env:
          NEXT_PUBLIC_LIBNAME: Sky
          NEXT_PUBLIC_LIBNAME_SHORT: sky
          NEXT_PUBLIC_LIBNAME_DOTSUFFIX_LABEL: docs
          NEXT_PUBLIC_LIBNAME_DOTSUFFIX_HREF: https://docs.pmnd.rs
          BASE_PATH: ${{ steps.set-base-path.outputs.BASE_PATH }}
          HOME_REDIRECT: /getting-started/introduction
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ github.ref_name }}/docs
          NEXT_PUBLIC_URL: ${{ steps.configurepages.outputs.base_url }}
          ICON: 🌅
          LOGO: /logo.png
          GITHUB: pmndrs/sky
          DISCORD: https://discord.gg/poimandres
          THEME_PRIMARY: '#323e48'
          THEME_SCHEME: tonalSpot
          THEME_CONTRAST: '0'
          THEME_NOTE: '#1f6feb'
          THEME_TIP: '#238636'
          THEME_IMPORTANT: '#8957e5'
          THEME_WARNING: '#d29922'
          THEME_CAUTION: '#da3633'
          CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}

      # --- 2. Examples gallery, built with a /examples/ sub-base so its
      # asset URLs resolve correctly once nested under the docs output.
      - name: Build examples gallery
        run: pnpm --filter @pmndrs/sky-example-vanilla build
        env:
          BASE_PATH: ${{ steps.set-base-path.outputs.BASE_PATH }}/examples/

      # --- 3. Merge: copy the examples build into the docs output under
      # /examples/. One directory tree, one Pages artifact below.
      - name: Merge examples build into docs output
        run: |
          set -ex
          test -d out # fail loudly if the docs build didn't land where expected
          mkdir -p out/examples
          cp -r examples/vanilla/dist/. out/examples/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
