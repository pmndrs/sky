<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>14 — Night sky (procedural + HDR)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #eee;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #info {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
        z-index: 10;
        max-width: 480px;
        line-height: 1.45;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <b>14 — Night sky.</b> Procedural starfield by default (zero asset cost). Toggle "source: hdri" in the GUI to load
      the demo Milky Way EXR (only bundled with examples — npm consumers must provide their own). Drag
      <b>elevation</b> below 0 to see twilight / night transitions.
    </div>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { Inspector } from 'three/addons/inspector/Inspector.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

      import { Sky } from '@sky/Sky'
      import { createDemoScene } from '@sky/demo/createDemoScene'
      import { createStartGate, logStage } from '@sky/demo/startGate'

      // Vite resolves this URL at request time; the EXR is fetched only when
      // the user toggles HDR mode in the GUI. NPM consumers replace this
      // with their own URL when calling `enableStars({ source: 'hdri', url })`.
      const HDR_URL = new URL('./hdri/NightSkyHDRI001_1K_HDR.exr', import.meta.url).href

      const gate = createStartGate({
        label: 'Start night-sky demo',
        stages: [
          'create WebGPU renderer',
          'renderer.init()',
          'sky: LUTs + cube + PMREM (first bake)',
          'enable procedural stars',
          'build demo scene + ground + sun',
          'render loop',
        ],
      })

      gate.run(async ({ markStage }) => {
        markStage(0, 'running')
        const renderer = new THREE.WebGPURenderer({ antialias: true })
        renderer.setPixelRatio(window.devicePixelRatio)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.toneMapping = THREE.ACESFilmicToneMapping
        renderer.toneMappingExposure = 0.5
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        renderer.inspector = new Inspector()
        document.body.appendChild(renderer.domElement)
        markStage(1, 'running')

        await logStage('renderer.init()', () => renderer.init())
        markStage(2, 'running')

        const sky = await logStage('Sky construct + first update()', async () => {
          const s = new Sky(renderer, {
            cubeSize: 256,
            sunDirection: { elevation: -10, azimuth: 180 },
            sunDisc: true,
            enableAerialPerspective: false,
          })
          s.baker.update()
          await renderer.getContext().queue?.onSubmittedWorkDone?.()
          return s
        })
        markStage(3, 'running')

        // Procedural stars are the default — no asset, no load wait.
        await sky.enableStars({ intensity: 1.0 })
        markStage(4, 'running')

        const demo = createDemoScene(sky.baker)
        const scene = demo.scene
        const camera = demo.camera
        scene.remove(demo.meshes.ground)
        demo.meshes.ground.geometry.dispose()
        demo.meshes.ground.material.dispose()

        sky.attach(scene)

        const ground = sky
          .createGround({
            mode: 'plane',
            size: 800,
            color: 0x222222,
            roughness: 0.4,
            reflective: true,
            blur: 2,
          })
          .attach(scene)

        const skySun = sky
          .createSun({
            intensity: 4.0,
            castShadow: true,
            shadowCamera: { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 200 },
          })
          .attach(scene)

        const skyMoon = sky
          .createMoon({
            intensity: 0.15,
            phase: 0.5,
            followSun: true,
            castShadow: true,
            shadowCamera: { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 200 },
          })
          .attach(scene)

        demo.meshes.mirror.castShadow = true
        demo.meshes.pbr.castShadow = true
        ground.mesh.receiveShadow = true

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 1.5, 0)
        controls.minDistance = 4
        controls.maxDistance = 40
        controls.update()

        createNightSkyGui({ renderer, sky, moon: skyMoon, hdrUrl: HDR_URL })

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(window.innerWidth, window.innerHeight)
        })
        markStage(5, 'running')

        renderer.setAnimationLoop(() => {
          try {
            sky.update(camera)
          } catch (err) {
            console.error('[animate] sky.update() failed:', err)
            renderer.setAnimationLoop(null)
            return
          }

          controls.update()
          renderer.render(scene, camera)
        })

        window.sky = sky
        window.skySun = skySun
        window.skyMoon = skyMoon
        window.skyGround = ground
        window.scene = scene
      })

      function createNightSkyGui({ renderer, sky, moon, hdrUrl }) {
        const state = {
          elevation: -10,
          azimuth: 180,
          exposure: renderer.toneMappingExposure,
          source: 'procedural',
          intensity: 1.0,
          density: 0.3,
          brightness: 1.0,
          rotation: 0.0,
          moonIntensity: 0.15,
          moonPhase: 0.5,
          moonFollowSun: true,
          moonElevation: 30,
          moonAzimuth: 0,
          moonShowDisc: true,
          moonDiscIntensity: 1.0,
        }

        const sunGroup = renderer.inspector.createParameters('Sun')
        sunGroup.add(state, 'elevation', -90, 90, 0.1).onChange(() => {
          sky.setSunDirection({ elevation: state.elevation, azimuth: state.azimuth })
        })
        sunGroup.add(state, 'azimuth', -180, 180, 0.1).onChange(() => {
          sky.setSunDirection({ elevation: state.elevation, azimuth: state.azimuth })
        })
        sunGroup.add(state, 'exposure', 0, 1, 0.001).onChange(() => {
          renderer.toneMappingExposure = state.exposure
        })

        const starsGroup = renderer.inspector.createParameters('Stars')
        starsGroup.add(state, 'source', ['procedural', 'hdri']).onChange(async () => {
          if (state.source === 'hdri' && !sky.stars?.texture) {
            // Lazy-load the HDR on first switch to HDR mode.
            await sky.enableStars({ source: 'hdri', url: hdrUrl, intensity: state.intensity, rotation: state.rotation })
          } else {
            sky.setStarsSource(state.source)
          }
        })
        starsGroup.add(state, 'intensity', 0, 4, 0.01).onChange(() => sky.setStarsIntensity(state.intensity))
        starsGroup.add(state, 'density', 0, 1, 0.01).onChange(() => sky.setStarsDensity(state.density))
        starsGroup.add(state, 'brightness', 0, 4, 0.01).onChange(() => sky.setStarsBrightness(state.brightness))
        starsGroup.add(state, 'rotation', 0, Math.PI * 2, 0.01).onChange(() => sky.setStarsRotation(state.rotation))

        const moonGroup = renderer.inspector.createParameters('Moon')
        moonGroup.add(state, 'moonIntensity', 0, 2, 0.01).onChange(() => moon.setIntensity(state.moonIntensity))
        moonGroup.add(state, 'moonPhase', 0, 1, 0.01).onChange(() => moon.setPhase(state.moonPhase))
        moonGroup.add(state, 'moonFollowSun').onChange(() => {
          moon.setFollowSun(state.moonFollowSun)
          if (!state.moonFollowSun) {
            moon.setDirection({ elevation: state.moonElevation, azimuth: state.moonAzimuth })
          }
        })
        moonGroup.add(state, 'moonElevation', -90, 90, 0.1).onChange(() => {
          if (!state.moonFollowSun) moon.setDirection({ elevation: state.moonElevation, azimuth: state.moonAzimuth })
        })
        moonGroup.add(state, 'moonAzimuth', -180, 180, 0.1).onChange(() => {
          if (!state.moonFollowSun) moon.setDirection({ elevation: state.moonElevation, azimuth: state.moonAzimuth })
        })
        moonGroup.add(state, 'moonShowDisc').onChange(() => moon.setDiscVisible(state.moonShowDisc))
        moonGroup
          .add(state, 'moonDiscIntensity', 0, 5, 0.01)
          .onChange(() => moon.setDiscIntensity(state.moonDiscIntensity))

        return { state }
      }
    </script>
  </body>
</html>
