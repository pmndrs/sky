<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>14 — Night sky</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #eee;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #info {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
        z-index: 10;
        max-width: 480px;
        line-height: 1.45;
      }
      #clock {
        font-variant-numeric: tabular-nums;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <b>14 — Night sky.</b> Stars are pixel-sharp sprites in the scene; the Milky Way is a glow map baked into the sky
      cube. Both are placed from time, date and latitude, dim toward the horizon, and fade in through twilight against
      the sky behind them. Scrub <b>timeOfDay</b> or tick <b>play</b> for a time-lapse from sunset.<br />
      <span id="clock"></span>
    </div>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { Inspector } from 'three/addons/inspector/Inspector.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

      import { Sky } from '@pmndrs/sky'
      import { createStartGate, logStage } from '@sky/demo/startGate'

      const gate = createStartGate({
        label: 'Start night-sky demo',
        stages: [
          'create WebGPU renderer',
          'renderer.init()',
          'sky: LUTs + cube + PMREM (first bake)',
          'enable stars + Milky Way',
          'build landscape',
          'render loop',
        ],
      })

      gate.run(async ({ markStage }) => {
        markStage(0, 'running')
        const renderer = new THREE.WebGPURenderer({ antialias: true })
        renderer.setPixelRatio(window.devicePixelRatio)
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.toneMapping = THREE.ACESFilmicToneMapping
        renderer.toneMappingExposure = 1.0
        renderer.inspector = new Inspector()
        document.body.appendChild(renderer.domElement)
        markStage(1, 'running')

        await logStage('renderer.init()', () => renderer.init())
        markStage(2, 'running')

        // Mid-July, mid-northern latitude, late evening: the summer Milky Way
        // core sits low in the south (camera looks south, north = +Z).
        const state = {
          timeOfDay: 21.25,
          dayOfYear: 196,
          latitude: 38,
          play: false,
          hoursPerSecond: 0.5,
          exposure: 1.0,
          stars: true,
          intensity: 1,
          size: 0.7,
          twinkle: 0.25,
          contrast: 40,
          magnitudeContrast: 0.75,
          count: 9000,
          milkyWay: 0.25,
          milkyWayContrast: 20,
          moon: false,
          moonIntensity: 0.15,
          moonPhase: 0.5,
        }

        const sky = await logStage('Sky construct + first update()', async () => {
          const s = new Sky(renderer, {
            timeOfDay: state.timeOfDay,
            dayOfYear: state.dayOfYear,
            latitude: state.latitude,
            enableAerialPerspective: false,
          })
          s.baker.update()
          await renderer.getContext().queue?.onSubmittedWorkDone?.()
          return s
        })
        markStage(3, 'running')

        const stars = await logStage('enableStars()', () => sky.enableStars())
        markStage(4, 'running')

        const scene = new THREE.Scene()
        sky.attach(scene) // background + environment, and adds the star sprites

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 2_000_000)
        camera.position.set(0, 1.7, 0)

        // Landscape: a large dark ground and a ring of distant ridgelines, so
        // stars and the Milky Way set behind real silhouettes (depth-tested).
        sky.createGround({ mode: 'plane', size: 60_000, color: 0x15130f, roughness: 0.95 }).attach(scene)
        const ridgeMat = new THREE.MeshStandardMaterial({ color: 0x1d1a15, roughness: 1 })
        const ridgeGeo = new THREE.ConeGeometry(1, 1, 7)
        for (let i = 0; i < 40; i++) {
          const a = (i / 40) * Math.PI * 2 + Math.sin(i * 12.9898) * 0.05
          const dist = 5000 + ((i * 37) % 9) * 900
          const h = 280 + ((i * 53) % 11) * 70
          const ridge = new THREE.Mesh(ridgeGeo, ridgeMat)
          ridge.scale.set(1800 + ((i * 17) % 5) * 300, h, 1800)
          ridge.position.set(Math.sin(a) * dist, h / 2 - 10, Math.cos(a) * dist)
          scene.add(ridge)
        }

        const sun = sky.createSun({ intensity: 3 }).attach(scene)
        const moon = sky.createMoon({ intensity: state.moonIntensity, phase: state.moonPhase, followSun: true })
        moon.setDiscVisible(false)

        const controls = new OrbitControls(camera, renderer.domElement)
        // Orbit a point a few metres ahead so dragging looks around the sky.
        controls.target.set(0, 1.7 + Math.tan(0.3) * 5, -5)
        controls.enablePan = false
        controls.enableZoom = false
        controls.rotateSpeed = -0.35
        controls.update()

        markStage(5, 'running')

        // --- GUI ---
        const setTime = () => {
          sky.setTimeOfDay(state.timeOfDay)
          updateClock()
        }
        const timeGroup = renderer.inspector.createParameters('Time & place')
        timeGroup.add(state, 'timeOfDay', 0, 24, 0.01).onChange(setTime).listen?.()
        timeGroup.add(state, 'play')
        timeGroup.add(state, 'hoursPerSecond', 0.05, 3, 0.05)
        timeGroup.add(state, 'dayOfYear', 1, 365, 1).onChange(() => {
          sky.setDayOfYear(state.dayOfYear)
          updateClock()
        })
        timeGroup.add(state, 'latitude', -90, 90, 0.1).onChange(() => sky.setLatitude(state.latitude))
        timeGroup.add(state, 'exposure', 0, 3, 0.01).onChange(() => (renderer.toneMappingExposure = state.exposure))

        const starsGroup = renderer.inspector.createParameters('Stars')
        starsGroup.add(state, 'stars').onChange(() => (state.stars ? sky.enableStars() : sky.disableStars()))
        starsGroup.add(state, 'intensity', 0, 4, 0.01).onChange(() => stars.setIntensity(state.intensity))
        starsGroup.add(state, 'size', 0.3, 2, 0.01).onChange(() => stars.setSize(state.size))
        starsGroup.add(state, 'twinkle', 0, 1, 0.01).onChange(() => stars.setTwinkle(state.twinkle))
        starsGroup.add(state, 'contrast', 1, 200, 1).onChange(() => stars.setContrast(state.contrast))
        starsGroup
          .add(state, 'magnitudeContrast', 0.3, 1, 0.01)
          .onChange(() => stars.setMagnitudeContrast(state.magnitudeContrast))
        starsGroup.add(state, 'count', 1000, 50000, 1000).onChange(() => stars.enable({ count: state.count }))

        const milkyGroup = renderer.inspector.createParameters('Milky Way')
        milkyGroup.add(state, 'milkyWay', 0, 2, 0.01).onChange(() => stars.setMilkyWay(state.milkyWay))
        milkyGroup
          .add(state, 'milkyWayContrast', 1, 200, 0.5)
          .onChange(() => stars.setMilkyWayContrast(state.milkyWayContrast))

        const moonGroup = renderer.inspector.createParameters('Moon')
        moonGroup.add(state, 'moon').onChange(() => {
          if (state.moon) moon.attach(scene)
          else moon.detach()
          moon.setDiscVisible(state.moon)
        })
        moonGroup.add(state, 'moonIntensity', 0, 1, 0.01).onChange(() => moon.setIntensity(state.moonIntensity))
        moonGroup.add(state, 'moonPhase', 0, 1, 0.01).onChange(() => moon.setPhase(state.moonPhase))

        // --- HUD clock ---
        const clockEl = document.getElementById('clock')
        function updateClock() {
          const h = ((state.timeOfDay % 24) + 24) % 24
          const hh = String(Math.floor(h)).padStart(2, '0')
          const mm = String(Math.floor((h % 1) * 60)).padStart(2, '0')
          clockEl.textContent = `${hh}:${mm} local solar time · day ${state.dayOfYear} · sun ${sky.sunElevation.toFixed(1)}°`
        }
        updateClock()

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(window.innerWidth, window.innerHeight)
        })

        const timer = new THREE.Timer()
        renderer.setAnimationLoop(() => {
          timer.update()
          if (state.play) {
            // Sidereal motion is visible within minutes of sim time; every
            // step also moves the sun, so the cube + PMREM re-bake each frame.
            state.timeOfDay = (state.timeOfDay + timer.getDelta() * state.hoursPerSecond) % 24
            setTime()
          }
          controls.update()
          try {
            sky.update(camera) // bakes when dirty + moves the star sprites with the camera
          } catch (err) {
            console.error('[animate] sky.update() failed:', err)
            renderer.setAnimationLoop(null)
            return
          }
          renderer.render(scene, camera)
        })

        window.sky = sky
        window.stars = stars
        window.scene = scene
        window.sun = sun
      })
    </script>
  </body>
</html>
