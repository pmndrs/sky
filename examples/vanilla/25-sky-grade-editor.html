<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@pmndrs/sky — Sky Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        font: 13px system-ui;
        color: white;
      }
      #view {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #main {
        display: block;
        width: 100%;
        height: 100%;
      }
      #camera {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 5px;
      }
      #camera button {
        padding: 6px 10px;
        background: #161a20cc;
        color: white;
        border: 1px solid #647080;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="view">
      <canvas id="main"></canvas>
      <div id="camera">
        <button id="edit">Sky Editor</button>
        <button data-look="sun">Sun</button>
        <button data-look="away">Away</button>
        <button data-look="up">Up</button>
        <button data-look="down">Ground</button>
      </div>
    </div>
    <script type="module" src="./grade-editor/main.js"></script>
  </body>
</html>
