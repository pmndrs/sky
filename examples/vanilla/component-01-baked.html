<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@pmndrs/sky — baked sky (drop-in)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #eee;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #info {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
        z-index: 10;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="info">@pmndrs/sky · baked Hillaire sky as a drop-in scene.environment / scene.background</div>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { Inspector } from 'three/addons/inspector/Inspector.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

      import { Sky, presets, looks } from '@pmndrs/sky'

      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(window.devicePixelRatio)
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.toneMappingExposure = 0.5
      renderer.inspector = new Inspector()
      document.body.appendChild(renderer.domElement)

      await renderer.init()

      // One line of public API — pick a preset, attach to a scene.
      const sky = new Sky(renderer, {
        preset: 'earth',
        timeOfDay: 14.5,
        latitude: 37.7,
        exposure: 40,
        sunDisc: true,
        // Drop AP entirely — this example is the simplest possible baked sky.
        enableAerialPerspective: false,
      })

      const scene = new THREE.Scene()
      sky.attach(scene)

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000)
      camera.position.set(6, 3, 10)
      camera.lookAt(0, 1, 0)

      // Demo geometry — mirror sphere reads the cube; PBR sphere reads PMREM mips;
      // matte ground proves the IBL kicks in correctly.
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 }),
      )
      ground.rotation.x = -Math.PI / 2
      scene.add(ground)

      const mirror = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 64, 64),
        new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.0 }),
      )
      mirror.position.set(-2.2, 1.5, 0)
      scene.add(mirror)

      const pbr = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 64, 64),
        new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.35 }),
      )
      pbr.position.set(2.2, 1.5, 0)
      scene.add(pbr)

      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 1.5, 0)
      controls.minDistance = 4
      controls.maxDistance = 40
      controls.update()

      // Inspector GUI — every slider drives a public Sky setter.
      const state = {
        preset: 'earth',
        timeOfDay: 14.5,
        latitude: 37.7,
        dayOfYear: 172,
        north: '+Z',
        exposure: 40,
        sunDisc: true,
        turbidity: 1.0,
        groundAlbedo: 0.3,
        toneExposure: renderer.toneMappingExposure,
        // Stylized look (ROADMAP 4.4). 'physical' = no look assigned;
        // 'ghibli (track)' follows sun elevation through the built-in track.
        look: 'physical',
        chroma: 0.7,
        value: 0.25,
        intensity: 1.0,
      }

      // Re-apply the selected look with the live chroma/value/intensity
      // overrides. All three are uniforms, so this costs a cube + PMREM
      // re-bake and never touches the LUT chain.
      const applySelectedLook = () => {
        if (state.look === 'physical') return sky.setLook(null)
        if (state.look === 'ghibli (track)') return sky.setLookTrack('ghibli')
        return sky.setLook({
          preset: state.look,
          chroma: state.chroma,
          value: state.value,
          intensity: state.intensity,
        })
      }
      const gui = renderer.inspector.createParameters('Sky')
      gui.add(state, 'preset', Object.keys(presets)).onChange((v) => sky.setPreset(v))
      gui.add(state, 'timeOfDay', 0, 24, 0.05).onChange((v) => sky.setTimeOfDay(v))
      gui.add(state, 'latitude', -90, 90, 0.5).onChange((v) => sky.setLatitude(v))
      gui.add(state, 'dayOfYear', 1, 365, 1).onChange((v) => sky.setDayOfYear(v))
      gui.add(state, 'north', ['+X', '-X', '+Z', '-Z']).onChange((v) => sky.setNorth(v))
      gui.add(state, 'exposure', 0, 200, 0.5).onChange((v) => sky.setExposure(v))
      gui.add(state, 'sunDisc').onChange((v) => sky.setSunDisc(v))
      gui.add(state, 'turbidity', 0, 4, 0.01).onChange((v) => sky.setTurbidity(v))
      gui.add(state, 'groundAlbedo', 0, 1, 0.01).onChange((v) => sky.setGroundAlbedo(v))
      gui.add(state, 'toneExposure', 0, 2, 0.001).onChange((v) => {
        renderer.toneMappingExposure = v
      })

      const lookGui = renderer.inspector.createParameters('Look')
      lookGui.add(state, 'look', ['physical', 'ghibli (track)', ...Object.keys(looks)]).onChange(applySelectedLook)
      // chroma swaps hue but keeps physical luminance (and is what haze can
      // share); value additionally overrides luminance, scaled by intensity.
      lookGui.add(state, 'chroma', 0, 1, 0.01).onChange(applySelectedLook)
      lookGui.add(state, 'value', 0, 1, 0.01).onChange(applySelectedLook)
      lookGui.add(state, 'intensity', 0, 4, 0.01).onChange(applySelectedLook)

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // Exposed for scripted verification / console poking (SKY_LOOKS_PLAN.md §1).
      window.__sky = sky
      window.__renderer = renderer

      renderer.setAnimationLoop(() => {
        sky.update(camera)
        controls.update()
        renderer.render(scene, camera)
      })
    </script>
  </body>
</html>
