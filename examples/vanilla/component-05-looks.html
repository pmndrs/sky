<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@pmndrs/sky — stylized looks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #eee;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #info {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
        z-index: 10;
        max-width: 420px;
        line-height: 1.4;
      }
      #ramp {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        z-index: 10;
        pointer-events: none;
        font-size: 11px;
      }
      #ramp .strip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      #ramp canvas {
        width: 28px;
        height: 220px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 3px;
        image-rendering: pixelated;
      }
      #ramp .labels {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 220px;
        opacity: 0.8;
        margin-bottom: 19px;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="info">
      @pmndrs/sky · <b>stylized looks</b> — a colour ramp over the physical sky. Drag to look around; the strip
      bottom-left is the <i>authored</i> ramp (horizon → zenith, sRGB, before intensity / exposure / tonemapping) so you
      can compare it with what the shader renders.
    </div>
    <div id="ramp">
      <div class="labels"><span>zenith</span><span>45°</span><span>horizon</span><span>−12°</span></div>
      <div class="strip"><canvas id="rampAuthored" width="1" height="128"></canvas><span>ramp</span></div>
      <div class="strip"><canvas id="rampSun" width="1" height="128"></canvas><span>+sun</span></div>
    </div>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import { Inspector } from 'three/addons/inspector/Inspector.js'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

      import {
        Sky,
        looks,
        lookTracks,
        registerLook,
        resolveLook,
        resolveLookTrack,
        sampleLook,
        sampleLookTrack,
        LOOK_UNIT_LUMINANCE,
      } from '@pmndrs/sky'

      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.setPixelRatio(window.devicePixelRatio)
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.toneMappingExposure = 0.5
      renderer.inspector = new Inspector()
      document.body.appendChild(renderer.domElement)

      await renderer.init()

      const sky = new Sky(renderer, {
        preset: 'earth',
        timeOfDay: 17.5,
        latitude: 37.7,
        exposure: 40,
        sunDisc: true,
        enableAerialPerspective: false,
      })

      const scene = new THREE.Scene()
      sky.attach(scene)

      // Wide, slightly upward-pitched first-person camera: the frame spans
      // horizon to ~55° elevation so the whole ramp is on screen at once.
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000)
      camera.position.set(0, 1.7, 0)

      // Ground + a few props so IBL from the styled PMREM is visible.
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(600, 600),
        new THREE.MeshStandardMaterial({ color: 0x3a4a3a, roughness: 0.95 }),
      )
      ground.rotation.x = -Math.PI / 2
      scene.add(ground)

      const mirror = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 64, 64),
        new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0 }),
      )
      mirror.position.set(-3, 1.2, -7)
      scene.add(mirror)

      const matte = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 64, 64),
        new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.8 }),
      )
      matte.position.set(3, 1.2, -7)
      scene.add(matte)

      // A ring of distant pillars gives the horizon a silhouette to read against.
      const pillarGeo = new THREE.BoxGeometry(3, 18, 3)
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x5a5a60, roughness: 0.9 })
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2
        const r = 90 + (i % 3) * 25
        const p = new THREE.Mesh(pillarGeo, pillarMat)
        p.position.set(Math.cos(a) * r, 9, Math.sin(a) * r)
        p.scale.y = 0.6 + (i % 4) * 0.35
        scene.add(p)
      }

      // First-person look-around: orbit a target that sits just in front of the
      // camera, so dragging rotates the view instead of the camera position.
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableZoom = false
      controls.enablePan = false
      controls.rotateSpeed = -0.35
      controls.minDistance = controls.maxDistance = 0.5

      const sunWorldDir = () => sky.baker.sky.sunDirection.value
      const lookToward = (dirXZ, pitchDeg) => {
        const horiz = new THREE.Vector3(dirXZ.x, 0, dirXZ.z).normalize()
        const pitch = THREE.MathUtils.degToRad(pitchDeg)
        const dir = horiz.multiplyScalar(Math.cos(pitch)).setY(Math.sin(pitch))
        controls.target.copy(camera.position).addScaledVector(dir, 0.5)
        controls.update()
      }

      // ---- look state + GUI ------------------------------------------------

      const trackNames = Object.keys(lookTracks)
      const state = {
        // Sun / render
        timeOfDay: 17.5,
        latitude: 37.7,
        exposure: 40,
        toneExposure: renderer.toneMappingExposure,
        toneMapping: 'ACES',
        sunDisc: true,
        // Look
        look: 'ghibli-dusk',
        chroma: 0.7,
        value: 0.25,
        intensity: 1.0,
        sunTintStrength: 0.6,
        sunTintFalloff: 0.3,
        // Custom ramp (4 stops). Colours are sRGB hex; positions are sin(elevation).
        c0At: -0.1,
        c0Color: '#ff9d6c',
        c1At: 0.05,
        c1Color: '#f3c98f',
        c2At: 0.4,
        c2Color: '#6fa3d8',
        c3At: 1.0,
        c3Color: '#2c5aa8',
        cEase: 'smooth',
        // Camera presets
        faceSun() {
          lookToward(sunWorldDir(), 22)
        },
        faceAway() {
          const s = sunWorldDir()
          lookToward({ x: -s.x, z: -s.z }, 22)
        },
        lookUp() {
          lookToward(sunWorldDir(), 70)
        },
        horizon() {
          lookToward(sunWorldDir(), 5)
        },
      }

      const TONE = {
        ACES: THREE.ACESFilmicToneMapping,
        Neutral: THREE.NeutralToneMapping,
        AgX: THREE.AgXToneMapping,
        None: THREE.NoToneMapping,
      }

      const customLookInput = () => ({
        stops: [
          { at: state.c0At, color: state.c0Color },
          { at: state.c1At, color: state.c1Color, ease: state.cEase },
          { at: state.c2At, color: state.c2Color, ease: state.cEase },
          { at: state.c3At, color: state.c3Color },
        ],
        chroma: state.chroma,
        value: state.value,
        intensity: state.intensity,
        sunTint: { color: '#ffd9a0', falloff: state.sunTintFalloff, strength: state.sunTintStrength },
      })

      /** The Look currently driving the shader, resolved in JS for the preview strip. */
      let activeLook = null

      const applySelectedLook = () => {
        if (state.look === 'physical') {
          activeLook = null
          sky.setLook(null)
        } else if (state.look.startsWith('track:')) {
          const name = state.look.slice('track:'.length)
          sky.setLookTrack(name)
          activeLook = sampleLookTrack(resolveLookTrack(name), { elevation: sky.sunElevation, time: state.timeOfDay })
        } else if (state.look === 'custom') {
          activeLook = registerLook('custom', customLookInput())
          sky.setLook('custom')
        } else {
          const base = resolveLook(state.look)
          activeLook = resolveLook({
            preset: state.look,
            chroma: state.chroma,
            value: state.value,
            intensity: state.intensity,
            sunTint: base.sunTint
              ? { color: base.sunTint.color, falloff: state.sunTintFalloff, strength: state.sunTintStrength }
              : null,
          })
          sky.setLook(activeLook)
        }
        drawRamp()
      }

      // When a preset is picked, pull its own chroma/value/intensity into the
      // sliders so the GUI reflects what is actually applied.
      const syncSlidersFromPreset = () => {
        const look = looks[state.look]
        if (!look) return
        state.chroma = look.chroma
        state.value = look.value
        state.intensity = look.intensity
        state.sunTintStrength = look.sunTint ? look.sunTint.strength : 0
        state.sunTintFalloff = look.sunTint ? look.sunTint.falloff : 0.3
      }

      const gui = renderer.inspector.createParameters('Sun')
      gui.add(state, 'timeOfDay', 0, 24, 0.05).onChange((v) => {
        sky.setTimeOfDay(v)
        if (state.look.startsWith('track:')) applySelectedLook()
      })
      gui.add(state, 'latitude', -90, 90, 0.5).onChange((v) => {
        sky.setLatitude(v)
        if (state.look.startsWith('track:')) applySelectedLook()
      })
      gui.add(state, 'exposure', 0, 200, 0.5).onChange((v) => sky.setExposure(v))
      gui.add(state, 'sunDisc').onChange((v) => sky.setSunDisc(v))
      gui.add(state, 'toneMapping', Object.keys(TONE)).onChange((v) => {
        renderer.toneMapping = TONE[v]
      })
      gui.add(state, 'toneExposure', 0, 2, 0.001).onChange((v) => {
        renderer.toneMappingExposure = v
      })
      gui.add(state, 'faceSun')
      gui.add(state, 'faceAway')
      gui.add(state, 'lookUp')
      gui.add(state, 'horizon')

      const lookGui = renderer.inspector.createParameters('Look')
      const lookChoices = ['physical', ...trackNames.map((n) => `track:${n}`), ...Object.keys(looks), 'custom']
      lookGui.add(state, 'look', lookChoices).onChange(() => {
        syncSlidersFromPreset()
        applySelectedLook()
      })
      lookGui.add(state, 'chroma', 0, 1, 0.01).onChange(applySelectedLook)
      lookGui.add(state, 'value', 0, 1, 0.01).onChange(applySelectedLook)
      lookGui.add(state, 'intensity', 0, 4, 0.01).onChange(applySelectedLook)
      lookGui.add(state, 'sunTintStrength', 0, 1, 0.01).onChange(applySelectedLook)
      lookGui.add(state, 'sunTintFalloff', 0.02, 1, 0.01).onChange(applySelectedLook)

      const customGui = renderer.inspector.createParameters('Custom ramp')
      for (const i of [0, 1, 2, 3]) {
        customGui.add(state, `c${i}At`, -1, 1, 0.01).onChange(() => {
          if (state.look === 'custom') applySelectedLook()
        })
        customGui.addColor(state, `c${i}Color`).onChange(() => {
          if (state.look === 'custom') applySelectedLook()
        })
      }
      customGui.add(state, 'cEase', ['linear', 'smooth']).onChange(() => {
        if (state.look === 'custom') applySelectedLook()
      })

      // ---- ramp preview strip ----------------------------------------------
      // Draws the JS reference `sampleLook` (the same math the shader mirrors)
      // over sin(elevation) from -0.2 (bottom) to 1 (top). Second strip adds
      // the sun tint at full lobe weight so you can see what the tint colour
      // does to the ramp.

      const stripA = document.getElementById('rampAuthored')
      const stripS = document.getElementById('rampSun')
      const ctxA = stripA.getContext('2d')
      const ctxS = stripS.getContext('2d')
      const tmp = new THREE.Color()
      const AT_MIN = -0.2
      const AT_MAX = 1.0
      function drawRamp() {
        const h = stripA.height
        for (let y = 0; y < h; y++) {
          const at = AT_MAX - ((y + 0.5) / h) * (AT_MAX - AT_MIN)
          let css = '#000'
          let cssSun = '#000'
          if (activeLook) {
            sampleLook(activeLook, at, tmp)
            css = `#${tmp.getHexString()}`
            if (activeLook.sunTint) tmp.lerp(activeLook.sunTint.color, activeLook.sunTint.strength)
            cssSun = `#${tmp.getHexString()}`
          }
          ctxA.fillStyle = css
          ctxA.fillRect(0, y, 1, 1)
          ctxS.fillStyle = cssSun
          ctxS.fillRect(0, y, 1, 1)
        }
        // Horizon tick.
        const yH = Math.round((AT_MAX / (AT_MAX - AT_MIN)) * h)
        ctxA.fillStyle = 'rgba(255,255,255,0.9)'
        ctxA.fillRect(0, yH, 1, 1)
        ctxS.fillStyle = 'rgba(255,255,255,0.9)'
        ctxS.fillRect(0, yH, 1, 1)
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // Exposed for scripted verification (scripts/verify-looks-ramp.mjs) and console poking.
      window.__sky = sky
      window.__renderer = renderer
      window.__camera = camera
      window.__controls = controls
      window.__state = state
      window.__applyLook = applySelectedLook
      window.__lookToward = lookToward
      window.__THREE = THREE
      window.__looks = {
        looks,
        lookTracks,
        resolveLook,
        resolveLookTrack,
        sampleLook,
        sampleLookTrack,
        registerLook,
        LOOK_UNIT_LUMINANCE,
      }

      syncSlidersFromPreset()
      applySelectedLook()
      state.faceSun()

      renderer.setAnimationLoop(() => {
        sky.update(camera)
        controls.update()
        renderer.render(scene, camera)
      })
    </script>
  </body>
</html>
